name: Push Docker Image to GHCR

on:
  push:
    branches:
      - feature/docker-backend # Disesuaikan dengan nama branch pengerjaanmu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Izin krusial agar workflow bisa push package ke GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Disediakan otomatis oleh GitHub

      - name: Convert Repository Name to Lowercase
        id: repo-name
        # Syarat wajib GHCR: Nama image harus huruf kecil semua
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Menggunakan tag nomor commit SHA, bukan latest
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}